name: My First Workflow

on:
  push:
    branches:
      - 'feature/**'
      - dev

env:
  APP_NAME: task-manager

jobs:
  first-job:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current directory
        run: pwd