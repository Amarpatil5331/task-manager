name: My First Workflow

on:
  push:
    branches:
      - 'feature/**'
      - dev

env:
  APP_NAME: task-manager

jobs:
  first-job:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development

    steps:
      - name: Step 1
        env:
          MESSAGE: Hello
        run: |
          echo "$APP_NAME"
          echo "$ENVIRONMENT"
          echo "$MESSAGE"

      - name: Step 2
        run: |
          echo "$APP_NAME"
          echo "$ENVIRONMENT"
          echo "$MESSAGE"