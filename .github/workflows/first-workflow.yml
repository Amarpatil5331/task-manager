name: My First Workflow

on:
  push:
    branches:
      - 'feature/**'
      - dev

env:
  APP_NAME: task-manager

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print application name
        run: echo "Application name is $APP_NAME"

      - name: Print another message
        run: echo "Learning GitHub Actions"